services:
  personal-color-service:
    build: .
    image: personal-color-service:latest
    container_name: personal-color-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8188
    # Mở ra mọi IP để truy cập trực tiếp qua IP_VPS:HOST_PORT.
    # Nếu đặt Nginx/Caddy phía trước, đổi thành "127.0.0.1:${HOST_PORT:-8188}:8188".
    ports:
      - "${HOST_PORT:-8188}:8188"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
